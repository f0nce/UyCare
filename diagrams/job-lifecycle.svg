<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="670" viewBox="0 0 1150 670"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#507268"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#193f35} .label{font-size:17px} .small{font-size:14px;fill:#60796f}</style><text x="35" y="45" font-size="25" font-weight="bold">UyCare job lifecycle</text><polyline points="215,217.5 300,217.5" fill="none" stroke="#507268" stroke-width="1.6" marker-end="url(#arrow)" /><text x="257" y="160" class="small" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:5px">Customer selects</text><polyline points="480,217.5 565,217.5" fill="none" stroke="#507268" stroke-width="1.6" marker-end="url(#arrow)" /><text x="523" y="160" class="small" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:5px">Provider starts</text><polyline points="745,217.5 830,217.5" fill="none" stroke="#507268" stroke-width="1.6" marker-end="url(#arrow)" /><text x="790" y="160" class="small" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:5px">Provider submits</text><polyline points="960.0,255 960.0,410" fill="none" stroke="#507268" stroke-width="1.6" marker-end="url(#arrow)" /><text x="1010" y="340" class="small" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:5px">Customer confirms</text><polyline points="960,180 960,110 655,110 655,180" fill="none" stroke="#507268" stroke-width="1.6" marker-end="url(#arrow)" /><text x="800" y="94" class="small" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:5px">Customer requests corrections</text><polyline points="125,255 125,450 300,450" fill="none" stroke="#507268" stroke-width="1.6" marker-end="url(#arrow)" /><text x="165" y="380" class="small" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:5px">Owner cancels</text><polyline points="390,255 390,410" fill="none" stroke="#507268" stroke-width="1.6" marker-end="url(#arrow)" /><text x="490" y="340" class="small" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:5px">Agreed cancellation</text><polyline points="655,255 655,448 600,448" fill="none" stroke="#507268" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="6 4" /><rect x="35" y="180" width="180" height="75" rx="9" fill="#fff" stroke="#527563" stroke-width="1.5" /><text x="125.0" y="223.5" text-anchor="middle" class="label">Open request</text><rect x="300" y="180" width="180" height="75" rx="9" fill="#fff" stroke="#527563" stroke-width="1.5" /><text x="390.0" y="223.5" text-anchor="middle" class="label">Assigned</text><rect x="565" y="180" width="180" height="75" rx="9" fill="#fff" stroke="#527563" stroke-width="1.5" /><text x="655.0" y="223.5" text-anchor="middle" class="label">In progress</text><rect x="830" y="180" width="260" height="75" rx="9" fill="#fff" stroke="#527563" stroke-width="1.5" /><text x="960.0" y="223.5" text-anchor="middle" class="label">Awaiting confirmation</text><rect x="830" y="410" width="260" height="75" rx="9" fill="#eaf1dd" stroke="#527563" stroke-width="1.5" /><text x="960.0" y="453.5" text-anchor="middle" class="label">Completed</text><rect x="300" y="410" width="300" height="75" rx="9" fill="#fff" stroke="#527563" stroke-width="1.5" /><text x="450.0" y="453.5" text-anchor="middle" class="label">Cancelled</text><text x="35" y="625" class="small">After assignment, either party requests cancellation and the other confirms; disputed cases go to moderation.</text><text x="35" y="645" class="small">Awaiting confirmation also permits agreed cancellation. Completed jobs alone are eligible for a customer review.</text></svg>